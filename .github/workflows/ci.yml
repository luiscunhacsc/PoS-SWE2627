name: Verify Mercado PoS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python scripts/check.py
      - run: python scripts/smoke_package.py
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/e2e.py
      - run: python scripts/benchmark.py
      - name: Runtime dependency audit and SBOM
        run: python -m pip_audit --no-deps --disable-pip -r requirements.txt -f cyclonedx-json -o artifacts/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            artifacts/
            dist/
