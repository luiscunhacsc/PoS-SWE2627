[build-system]
requires = ["setuptools==82.0.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mercado-pos"
version = "0.1.0"
description = "PoS académico para uma cadeia fictícia de supermercados"
requires-python = ">=3.10"
dependencies = ["Flask==3.1.3", "waitress==3.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mercado = ["schema.sql", "templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
